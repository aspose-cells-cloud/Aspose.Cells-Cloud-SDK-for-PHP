name: Aspose Cells Cloud SDK for PHP

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: windows-latest

    env:
      CellsCloudClientId: ${{ secrets.PRODUCTCLIENTID }}
      CellsCloudClientSecret: ${{ secrets.PRODUCTCLIENTSECRET }}
      # ===== 新增：覆盖 GitHub Actions 自动提供的 GITHUB_TOKEN =====
      # Composer 会读取此变量尝试认证 GitHub，token 中的特殊字符会导致 install 失败
      GITHUB_TOKEN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP with OpenSSL on Windows
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: openssl,zip
          ini-values: curl.cainfo=${{ github.workspace }}/cacert.pem
          coverage: none

      - name: Download cacert.pem
        run: curl -o cacert.pem https://curl.se/ca/cacert.pem

      # 关闭 Composer 2.9+ 的安全告警拦截
      - name: Disable Composer advisory blocking
        run: composer config --global policy.advisories.block false

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Example Codes
        shell: cmd
        env:
          # ===== 新增：步骤级也覆盖，防止 examples/composer.bat 继承到 token =====
          GITHUB_TOKEN: ""
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1
        run: |
          cd examples
          .\composer.bat install --prefer-dist --no-progress --no-interaction
          php .\QuickStart\QuickStart.php
          php .\Conversion\ConvertChart.php
          php .\Conversion\ConvertWorkbook.php
          php .\Conversion\ConvertRange.php
          php .\Conversion\ConvertTable.php
          php .\Conversion\ConvertWorksheet.php
          php .\CloudStorage\FileManagement.php
          php .\DataProcessing\SplitWorkbook.php
          php .\DataProcessing\CleanData.php
          php .\DataProcessing\TrimCharacters.php
          php .\DataProcessing\TrimContent.php
          php .\AI\DecomposeTask.php
          php .\AI\TranslateSpreadsheet.php
