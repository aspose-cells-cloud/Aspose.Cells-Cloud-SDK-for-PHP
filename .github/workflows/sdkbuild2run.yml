name: Aspose Cells Cloud SDK for PHP

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: windows-latest

    env:
      CellsCloudClientId: ${{ secrets.PRODUCTCLIENTID }}
      CellsCloudClientSecret: ${{ secrets.PRODUCTCLIENTSECRET }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up PHP with OpenSSL on Windows
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'  # Adjust as needed
        extensions: openssl,zip
        ini-values: curl.cainfo=${{ github.workspace }}/cacert.pem
        coverage: none

    - name: Download cacert.pem
      run: curl -o cacert.pem https://curl.se/ca/cacert.pem

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run Example Codes
      shell: pwsh
      run: |
        cd examples
        .\composer.bat install --prefer-dist --no-progress
        $files = Get-ChildItem -Recurse -Filter *.php | Where-Object { $_.Name -notlike '*vendor*' } | Sort-Object FullName
        $total = $files.Count
        $passed = 0
        $failed = @()
        foreach ($f in $files) {
          Write-Host "===[$($passed + $failed.Count + 1)/$total] Running: $($f.FullName)]===" -ForegroundColor Cyan
          $exitCode = 0
          php "$($f.FullName)" 2>&1 | Out-Host
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            $passed++
            Write-Host "  PASSED" -ForegroundColor Green
          } else {
            $failed += $f.Name
            Write-Host "  FAILED (exit code: $exitCode)" -ForegroundColor Red
          }
        }
        Write-Host ""
        Write-Host "===== Results: $passed PASSED, $($failed.Count) FAILED =====" -ForegroundColor $(if ($failed.Count -eq 0) { 'Green' } else { 'Red' })
        if ($failed.Count -gt 0) {
          Write-Host "Failed files:" -ForegroundColor Red
          $failed | ForEach-Object { Write-Host "  - $_" -ForegroundColor Red }
          exit 1
        }
